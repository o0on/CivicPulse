# IMPORTANT: This file contains ONLY secret references, not actual values.
# Use sealed-secrets, external-secrets, or vault to populate.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
  annotations:
    # Populate via: kubectl create secret generic civicpulse-secrets --from-env-file=.env
    managed-by: "external-secrets"
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  REDIS_URL: "${REDIS_URL}"
  SECRET_KEY: "${SECRET_KEY}"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

