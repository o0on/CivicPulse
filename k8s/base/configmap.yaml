apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
data:
  TRIAGE_PROVIDER: "rules"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  STATS_CACHE_TTL: "30"
  CORS_ORIGINS: '["https://civicpulse.example.com"]'
  OLLAMA_BASE_URL: "http://ollama:11434"
