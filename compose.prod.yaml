services:
  postgres:
    ports: []
  redis:
    ports: []
  backend:
    image: ghcr.io/YOUR_ORG/civicpulse-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    env_file: []
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    image: ghcr.io/YOUR_ORG/civicpulse-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    ports: ["80:80"]
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
